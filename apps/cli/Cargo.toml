[package]
name = "pendon"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Pendon CLI"

[dependencies]
pendon-core = { path = "../../crates/core" }
pendon-extra = { path = "../../crates/extra" }
pendon-plugin-anchor = { path = "../../crates/plugin-anchor" }
pendon-plugin-bind = { path = "../../crates/plugin-bind" }
pendon-plugin-blockquote = { path = "../../crates/plugin-blockquote" }
pendon-plugin-cite = { path = "../../crates/plugin-cite" }
pendon-plugin-codeblock = { path = "../../crates/plugin-codeblock" }
pendon-plugin-custom = { path = "../../crates/plugin-custom" }
pendon-plugin-dialog = { path = "../../crates/plugin-dialog" }
pendon-plugin-directive = { path = "../../crates/plugin-directive" }
pendon-plugin-extract = { path = "../../crates/plugin-extract" }
pendon-plugin-frontmatter = { path = "../../crates/plugin-frontmatter" }
pendon-plugin-heading = { path = "../../crates/plugin-heading" }
pendon-plugin-image = { path = "../../crates/plugin-image" }
pendon-plugin-latex = { path = "../../crates/plugin-latex" }
pendon-plugin-list = { path = "../../crates/plugin-list" }
pendon-plugin-markdown = { path = "../../crates/plugin-markdown" }
pendon-plugin-marker = { path = "../../crates/plugin-marker" }
pendon-plugin-number = { path = "../../crates/plugin-number" }
pendon-plugin-section = { path = "../../crates/plugin-section" }
pendon-plugin-table = { path = "../../crates/plugin-table" }
pendon-plugin-wiki = { path = "../../crates/plugin-wiki" }
pendon-renderer-ast = { path = "../../crates/renderer-ast" }
pendon-renderer-events = { path = "../../crates/renderer-events" }
pendon-renderer-html = { path = "../../crates/renderer-html" }
pendon-renderer-json = { path = "../../crates/renderer-json" }
pendon-renderer-solid = { path = "../../crates/renderer-solid" }
pendon-tui = { path = "../../crates/tui" }
pendon-types = { path = "../../crates/types" }
pico-args = "0.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "html"] }
toml = "1.1"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "pendon"
path = "src/main.rs"
