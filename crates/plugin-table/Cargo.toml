[package]
name = "pendon-plugin-table"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Advanced table syntax plugin for Pendon"

[dependencies]
pendon-core = { path = "../core" }
pendon-plugin-markdown = { path = "../plugin-markdown" }
pendon-renderer-html = { path = "../renderer-html" }
pendon-renderer-solid = { path = "../renderer-solid" }
serde = { version = "1", features = ["derive"] }
