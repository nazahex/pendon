[[task]]
name = "Vicado Demo (Solid)"
input = "./src/[...slug].md"
output = "./out/[...slug].jsx"
plugin = "markdown,vicado"
format = "solid"
pretty = true

[[task]]
name = "Vicado Demo (AST)"
input = "./src/[...slug].md"
output = "./out/[...slug].json"
plugin = "markdown,vicado"
