pretty = true

[[task]]
name = "Vicado + Syntect Demo (Solid)"
input = "./src/[...slug].md"
output = "./out/[...slug].syntect.jsx"
plugin = "markdown,vicado,syntect"
format = "solid"
pretty = true

[plugin-vicado.renderer.solid]

[[plugin-vicado.renderer.solid.imports]]
