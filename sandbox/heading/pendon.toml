[[task]]
name = "Plugin Heading Demo Solid"
input = "./src/heading.md"
output = "./out/heading.jsx"
plugin = "micromatter,section,heading,markdown,extract-heading"
format = "solid"

[task.heading]
auto_number = true
number_style = "nested-number"

[task.heading.custom.heading]
name = "DocHeading"
template = "<DocHeading {...attrs} >{children}</DocHeading>"

[[task.heading.custom.heading.imports]]
module = "@/components/DocHeading"
default = "DocHeading"

# === Normal

[[task]]
name = "Normal Demo Solid"
input = "./src/normal.md"
output = "./out/normal.jsx"
plugin = "micromatter,section,markdown,heading,extract-heading"
format = "solid"
