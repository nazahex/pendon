[[task]]
name = "Plugin Heading Demo Solid"
input = "./src/heading.mdp"
output = "./out/heading.jsx"
plugin = "micromatter,section,heading,number,markdown"
format = "solid"

[[task.heading.number]]
style = "decimal"

[task.heading.custom.heading]
name = "DocHeading"
template = "<DocHeading {...attrs} >{children}</DocHeading>"

[[task.heading.custom.heading.imports]]
module = "@/components/DocHeading"
default = "DocHeading"

