[[task]]
name = "Image Demo (Solid)"
input = "./src/[slug].mdp"
output = "./out/[slug].jsx"
plugin = "image,cite,wiki,anchor,markdown"
format = "solid"
no_cache = true
markdown_allow_html = true

[[task.image.custom.img]]
type = ["imageX", "thumb"]
name = "ImageThumb"
imports = "import { ImageThumb } from '@comp/AdvancedImage'"
template = "<ImageThumb type={\"{attrs.type}\"} {...attrs}>{children}</ImageThumb>"

[[task.image.custom.img]]
name = "AdvancedImage"
imports = "import AdvancedImage from '@comp/AdvancedImage'"
template = "<AdvancedImage {...attrs}>{children}</AdvancedImage>"

