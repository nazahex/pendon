name = "aside"
kind = "block"

[matcher]
start_regex = '^:::(?P<type>note|info|warn|error|task)(?:\s*\[\s*"?(?P<title>[^\]"]+)"?\s*\])?\s*$'
end = ":::"
capture = "rest"
parse_hint = "bracket-arg"

[[attrs]]
name = "type"
type = "string"
required = true

[[attrs]]
name = "title"
type = "string"
required = false

[ast]
node = "Component"
node_name = "Parego"
attrs_map = { type = "type", title = "title" }

[renderer.solid]
component_template = "<Parego type=\"{attrs.type}\" title=\"{attrs.title}\">{children}</Parego>"

[[renderer.solid.imports]]
module = "@comp/shared/Parego"
default = "Parego"

[meta]
description = "Render :::note|info|warn|error|task blocks to Parego component"
