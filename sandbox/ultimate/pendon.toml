# =============================================================================
# PENDON.TOML: CONFIG COMPANION OF ULTIMATE.MD
# =============================================================================
# PURPOSE
#   Drives the combinatorial stress test in src/ultimate.md. One input, three
#   tasks, so config variations are covered without extra files. Output goes to
#   out/{full,default,subset}/ultimate.jsx and is compared against frozen
#   renders (the diff is the test). Run: pendon run -F
#
# TASKS (each one verifies a different promise)
#   1. "Unified Full"     all plugins, custom components on every layer.
#                         Verifies routing: typed entry, default entry, string
#                         vs array `type`, string vs array `imports`, custom
#                         bracket_key/parentheses_key, attrs placeholders.
#   2. "Unified Defaults" all plugins, NO custom at all. Verifies that every
#                         construct falls back to built-in elements (directives
#                         to <span>/<div>, like markers) and that extras still
#                         become attributes. Keep it empty on purpose.
#   3. "Unified Subset"   only a few plugins, html off, comments kept.
#                         Verifies that syntax of a disabled plugin stays
#                         literal text and never crashes.
#
# RULES THAT KEEP THIS FILE USEFUL
#   - Component names/imports are fake placeholders. Nothing is resolved; they
#     only need to appear correctly in the generated JSX.
#   - Every `type` here must match an @@type / ::type / ==type / {{type}} used
#     in ultimate.md (anchorA/B/C, headingX/Y, imageX/thumb, figureX, citeX,
#     markerA/footnote/bibliography, asideA/B, note, tableX, tbodyX, tfootX,
#     rowA/B, cellA/B). Types are ASCII alphanumeric only.
#   - Some types are intentionally NOT configured (anchorZ, anchor1, headingZ,
#     figureZ, citeZ, tableZ, captionZ, zzz...) to test the "unclaimed type ->
#     layer default" path. Do not "fix" them.
#   - Directive has NO default entry on purpose: unclaimed directives must
#     render as built-in <span> (inline) / <div> (block).
#   - Within one layer, use either [table] or [[array of tables]], never both.
#     Both forms are used across layers on purpose.
#   - Layer layout follows the latest demo (task.<plugin>.custom.<layer>).
#     The wiki custom block is commented out because its key is unconfirmed.
#   - Blockquote and list ARE configured now: the `blockquote` and `list`
#     plugins sit before `markdown` in Tasks 1 and 2, and the Q/L sections
#     exercise the inner head and the container decorator. Task 3 keeps them
#     out, so its Q/L syntax stays literal text. Unknown plugin names /
#     unknown task.* keys must not be silent.
#
# WHEN THE PROJECT CHANGES
#   New plugin/layer : add its plugin id to Tasks 1 and 2 (Task 3 only if it
#                      should be enabled in the subset); in Task 1 add one typed
#                      entry + one default entry using the types you put in
#                      ultimate.md; leave Task 2 empty.
#   New config key   : add one use in Task 1; if it changes fallback behavior,
#                      also set it in Task 2 or 3.
#   Renamed/removed  : update every entry and every matching type in
#                      ultimate.md in the same commit.
#   Always           : regenerate, review the diff for all 3 tasks by hand,
#                      then freeze.
# =============================================================================

# ============================================================================
# TASK 1: FULL CUSTOM
# ============================================================================

[[task]]
name = "Unified Full"
input = "./src/[slug].md"
output = "./out/full/[slug].jsx"
plugin = "micromatter,section,heading,table,image,directive,cite,wiki,anchor,marker,blockquote,list,number,markdown,latex,syntect"
format = "solid"
markdown_strip_comments = true
markdown_allow_html = true
wiki_link_prefix = "/wiki"

# --- ANCHOR: type array + type string + default; imports string & array -----

[[task.anchor.custom]]
type = ["anchorA", "anchorB"]
name = "AnchorAB"
imports = "import { AnchorAB } from '@comp/shared/Anchor'"
template = "<AnchorAB type={\"{attrs.type}\"} {...attrs}>{children}</AnchorAB>"

[[task.anchor.custom]]
type = "anchorC"
name = "AnchorC"
imports = ["import { AnchorC } from '@comp/shared/Anchor'", "import '@comp/shared/anchor-c.css'"]
template = "<AnchorC slug={\"{attrs.slug}\"} title={\"{attrs.title}\"} id={\"{attrs.id}\"} {...attrs}>{children}</AnchorC>"

[[task.anchor.custom]]
name = "AnchorDefault"
imports = "import { AnchorDefault } from '@comp/shared/Anchor'"
template = "<AnchorDefault {...attrs}>{children}</AnchorDefault>"

# --- HEADING ----------------------------------------------------------------

[[task.heading.number]]
style = "decimal"

[[task.heading.custom]]
type = ["headingX", "headingY"]
name = "HeadingXY"
imports = "import { HeadingXY } from '@comp/Heading'"
# `number` is written by `plugin-number` as an array (ADR-0010); `{...attrs}`
# spreads it as a real JS value, so the template must not stringify it.
template = "<HeadingXY level={\"{attrs.level}\"} type={\"{attrs.type}\"} {...attrs}>{children}</HeadingXY>"

[[task.heading.custom]]
name = "HeadingDefault"
imports = "import { HeadingDefault } from '@comp/Heading'"
template = "<HeadingDefault {...attrs}>{children}</HeadingDefault>"

# --- IMAGE: typed + default for both img and figure -------------------------

[[task.image.custom.img]]
type = ["imageX", "thumb"]
name = "ImageThumb"
imports = "import { ImageThumb } from '@comp/AdvancedImage'"
template = "<ImageThumb type={\"{attrs.type}\"} {...attrs}>{children}</ImageThumb>"

[[task.image.custom.img]]
name = "AdvancedImage"
imports = "import AdvancedImage from '@comp/AdvancedImage'"
template = "<AdvancedImage {...attrs}>{children}</AdvancedImage>"

[[task.image.custom.figure]]
type = ["figureX"]
name = "FigureX"
imports = "import { FigureX } from '@comp/Figure'"
template = "<FigureX {...attrs}>{children}</FigureX>"

[[task.image.custom.figure]]
name = "Figure"
imports = "import Figure from '@comp/Figure'"
template = "<Figure {...attrs}>{children}</Figure>"

# --- CITE: typed + default --------------------------------------------------

[task.cite]
reference_source = "internal"

[[task.cite.custom]]
type = ["citeX"]
name = "CiteX"
imports = "import { CiteX } from '@comp/Cite'"
template = "<CiteX reference={references[\"{attrs.ref_id}\"]} {...attrs} />"

[[task.cite.custom]]
name = "Cite"
imports = "import { Cite } from '@comp/Cite'"
template = "<Cite reference={references[\"{attrs.ref_id}\"]} {...attrs} />"

# --- WIKI: opsional, layout key belum pasti. Aktifkan bila spec mendukung ---
# [task.wiki.custom.anchor]
# name = "WikiLink"
# imports = "import { WikiLink } from '@comp/Wiki'"
# template = "<WikiLink href={\"{attrs.href}\"} {...attrs}>{children}</WikiLink>"

# --- MARKER: type string, type array (self-closing), default ----------------

[[task.marker.custom]]
type = "bibliography"
name = "Bibliography"
imports = "import { Bibliography } from '@comp/Cite'"
template = "<Bibliography citations={citations} references={references} />"

[[task.marker.custom]]
type = ["markerA", "footnote"]
name = "MarkerA"
imports = "import { MarkerA } from '@comp/Marker'"
template = "<MarkerA type={\"{attrs.type}\"} {...attrs}>{children}</MarkerA>"

[[task.marker.custom]]
name = "MarkerDefault"
imports = "import { MarkerDefault } from '@comp/Marker'"
template = "<MarkerDefault {...attrs}>{children}</MarkerDefault>"

# --- DIRECTIVE: custom bracket/parentheses keys, no default -> built-in span/div

[[task.directive.custom]]
type = ["asideA", "asideB"]
name = "AsideAB"
imports = "import { AsideAB } from '@comp/AsideAB'"
template = "<AsideAB slug={\"{attrs.slug}\"} title={\"{attrs.title}\"} type={\"{attrs.type}\"} {...attrs}>{children}</AsideAB>"

[[task.directive.custom]]
type = ["note"]
name = "Note"
field.bracket.bare = "id"
field.paren.bare = "level"
# The preset is void as a whole (D-7), so the item names are spelled out too.
field.specs.tick = "slug"
field.specs.quote = "title"
imports = "import Note from '@comp/Note'"
template = "<Note {...attrs}>{children}</Note>"

# --- BLOCKQUOTE: §9.2 primary layer `blockquote`. Typed entry + default -------
# `bqZ` is intentionally unconfigured so it exercises "unclaimed type ->
# layer default" (§11 rule 3). A plain quote (no head, no decorator) also
# reaches the default.

[[task.blockquote.custom]]
type = ["bqA", "bqB"]
name = "BlockquoteAB"
imports = "import { BlockquoteAB } from '@comp/Blockquote'"
template = "<BlockquoteAB type={\"{attrs.type}\"} {...attrs}>{children}</BlockquoteAB>"

[[task.blockquote.custom]]
name = "BlockquoteDefault"
imports = "import { BlockquoteDefault } from '@comp/Blockquote'"
template = "<BlockquoteDefault {...attrs}>{children}</BlockquoteDefault>"

# --- LIST: §9.3/§9.4 container layers `unordered` / `ordered`. The marker
#     (`-`/`*`/`+` vs `1.`) decides the layer (§9.4), never the decorator's own
#     type. `unorderedZ` is intentionally unconfigured (layer default path).
#     The `list` item layer (L2/L3) is a later step and is not configured yet.

[[task.list.custom.unordered]]
type = ["unorderedA", "compact"]
name = "UnorderedACompact"
imports = "import { UnorderedACompact } from '@comp/List'"
template = "<UnorderedACompact type={\"{attrs.type}\"} {...attrs}>{children}</UnorderedACompact>"

[[task.list.custom.unordered]]
name = "UnorderedDefault"
imports = "import { UnorderedDefault } from '@comp/List'"
template = "<UnorderedDefault {...attrs}>{children}</UnorderedDefault>"

[[task.list.custom.ordered]]
type = ["orderedA"]
name = "OrderedA"
imports = "import { OrderedA } from '@comp/List'"
template = "<OrderedA type={\"{attrs.type}\"} {...attrs}>{children}</OrderedA>"

[[task.list.custom.ordered]]
name = "OrderedDefault"
imports = "import { OrderedDefault } from '@comp/List'"
template = "<OrderedDefault {...attrs}>{children}</OrderedDefault>"

# --- TABLE: 7 layers. table/tbody/tfoot typed+default; caption/thead single;
#            row/cell typed+default -----------------------------------------

[[task.table.custom.table]]
type = ["tableX"]
name = "TableX"
imports = "import { TableX } from '@comp/Table'"
template = "<TableX {...attrs}>{children}</TableX>"

[[task.table.custom.table]]
name = "Table"
imports = "import Table from '@comp/Table'"
template = "<Table {...attrs}>{children}</Table>"

[task.table.custom.caption]
name = "TableCaption"
imports = "import { TableCaption } from '@comp/Table'"
template = "<TableCaption {...attrs}>{children}</TableCaption>"

[task.table.custom.thead]
name = "TableHead"
imports = "import { TableHead } from '@comp/Table'"
template = "<TableHead {...attrs}>{children}</TableHead>"

[[task.table.custom.tbody]]
type = ["tbodyX"]
name = "TableBodyX"
imports = "import { TableBodyX } from '@comp/Table'"
template = "<TableBodyX {...attrs}>{children}</TableBodyX>"

[[task.table.custom.tbody]]
name = "TableBody"
imports = "import { TableBody } from '@comp/Table'"
template = "<TableBody {...attrs}>{children}</TableBody>"

[[task.table.custom.tfoot]]
type = ["tfootX"]
name = "TableFootX"
imports = "import { TableFootX } from '@comp/Table'"
template = "<TableFootX {...attrs}>{children}</TableFootX>"

[[task.table.custom.tfoot]]
name = "TableFoot"
imports = "import { TableFoot } from '@comp/Table'"
template = "<TableFoot {...attrs}>{children}</TableFoot>"

[[task.table.custom.row]]
type = ["rowA", "rowB"]
name = "TableRowAB"
imports = "import { TableRowAB } from '@comp/Table'"
template = "<TableRowAB type={\"{attrs.type}\"} {...attrs}>{children}</TableRowAB>"

[[task.table.custom.row]]
name = "TableRowDefault"
imports = "import { TableRowDefault } from '@comp/Table'"
template = "<TableRowDefault {...attrs}>{children}</TableRowDefault>"

[[task.table.custom.cell]]
type = ["cellA", "cellB"]
name = "TableCellAB"
imports = "import { TableCellAB } from '@comp/Table'"
template = "<TableCellAB type={\"{attrs.type}\"} {...attrs}>{children}</TableCellAB>"

[[task.table.custom.cell]]
name = "TableCellDefault"
imports = "import { TableCellDefault } from '@comp/Table'"
template = "<TableCellDefault {...attrs}>{children}</TableCellDefault>"

# ============================================================================
# TASK 2: DEFAULTS. Semua plugin aktif, TIDAK ada custom sama sekali.
# Semua konstruk harus jatuh ke elemen HTML bawaan; extras tetap harus
# muncul sebagai atribut (class, id, data, style var, dst).
# ============================================================================

[[task]]
name = "Unified Defaults"
input = "./src/[slug].md"
output = "./out/default/[slug].jsx"
plugin = "micromatter,section,heading,table,image,directive,cite,wiki,anchor,marker,blockquote,list,number,markdown,latex,syntect"
format = "solid"
markdown_strip_comments = true
markdown_allow_html = true


[task.cite]
reference_source = "internal"

# ============================================================================
# TASK 3: SUBSET. Plugin dikurangi, html off, comment dipertahankan.
# Konstruk milik plugin yang tidak aktif (img, cite, wiki, marker, directive) harus tetap jadi teks biasa, tanpa crash. Anchor, heading,
# table memakai config yang berbeda dari Task 1.
# ============================================================================

[[task]]
name = "Unified Subset"
input = "./src/[slug].md"
output = "./out/subset/[slug].jsx"
plugin = "micromatter,heading,table,anchor,number,markdown"
format = "solid"
markdown_strip_comments = false
markdown_allow_html = false

[[task.heading.number]]
style = "decimal"

[[task.anchor.custom]]
type = ["anchorA", "anchorB", "anchorC", "anchorZ"]
name = "AnchorAll"
imports = ["import { AnchorAll } from '@comp/shared/Anchor'"]
template = "<AnchorAll {...attrs}>{children}</AnchorAll>"

[task.table.custom.table]
name = "Table"
imports = "import Table from '@comp/Table'"
template = "<Table {...attrs}>{children}</Table>"

[[task.table.custom.cell]]
type = ["cellA"]
name = "TableCellA"
imports = "import { TableCellA } from '@comp/Table'"
template = "<TableCellA {...attrs}>{children}</TableCellA>"
