[[task]]
name = "Plugin Directive Demo Solid"
input = "./src/[slug].mdp"
output = "./out/[slug].jsx"
plugin = "directive,markdown,extract"
format = "solid"
no_cache = true

[[task.directive.custom]]
type = ["DireA", "DirA"]
name = "DireA"
field.bracket.bare = "label"
field.paren.bare = "kind"
field.specs.tick = "author"
field.specs.quote = "summary"
imports = "import { DireA } from '@comp/DireA'"
template = "<DireA slug={\"{attrs.slug}\"} title={\"{attrs.title}\"} type={\"{attrs.type}\"} {...attrs}>{children}</DireA>"

[[task.directive.extract]]
type = ["DireA", "DirA"]
export = "direA"
# only = ["label", "kind", "author", "summary"]
