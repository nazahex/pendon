# === CITE SOLID ===

[[task]]
name = "Cite Sandbox (Solid)"
input = "./src/[slug].mdp"
output = "./out/[slug].jsx"
plugin = "micromatter,marker,cite,markdown"
format = "solid"
no_cache = true
markdown_allow_html = true
post_hook = ["prettier --write ./out/[slug].jsx"]

[task.cite]
reference_source = "external"
reference_file = "./src/reference.yaml"
ref_id_prefix = "ref-" # Prefix for `href` linking to bibliography entries
citation_class = "citation" # CSS class for the inline `<sup>` citation element
citation_id_prefix = "cite-" # Prefix for inline anchor IDs (backlink targets from bibliography)
references_export = "references" # Override the exported variable name for references data
citations_export = "citations"
references_scope = "all" # `cited` (external default) | `all` (frontmatter default)

[task.cite.custom]
name = "Cite"
imports = "import { Cite } from '@comp/content/Cite'"
template = "<Cite reference={references[\"{attrs.ref_id}\"]} {...attrs} />"

[task.marker.custom]
type = ["bibliography"]
name = "Bibliography"
imports = "import { Bibliography } from '@comp/content/Bibliography'"
template = "<Bibliography references={references} citations={citations} {...attrs} />"

