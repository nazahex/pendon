[workspace]
members = [
  "apps/cli",
  "crates/core",
  "crates/plugin-anchor",
  "crates/plugin-cite",
  "crates/plugin-heading",
  "crates/plugin-latex",
  "crates/plugin-vicado",
  "crates/plugin-wiki",
  "crates/renderer-json",
  "crates/tui",
  "tools/scope",
]
resolver = "2"

[profile.release]
# Modern yet stable release profile tuned for small binaries
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
