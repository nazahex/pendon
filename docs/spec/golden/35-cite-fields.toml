[[task]]
name = "Golden 35"
input = "./src/[slug].mdp"
output = "./out/[slug].jsx"
plugin = "frontmatter,cite,markdown"
format = "solid"

[task.cite]
reference_source = "internal"
# §7.3: the identity is names, not positions — `reference_id` follows the tick and
# `locator` is the author's own field, listed so it still splits the number.
stable_fields = ["reference_id", "locator"]

# One slot assignment voids the preset (D-7), so both positions are redefined; the
# overrides publish them under shorter names (D-4). The processor is not affected
# by either — it reads `reference_id` by name.
[[task.cite.custom]]
type = ["citeShort"]
name = "CiteShort"
imports = "import { CiteShort } from '@comp/CiteShort'"
template = "<CiteShort reference={references[\"{attrs.ref_id}\"]} {...attrs} />"
field.bracket.tick = "reference_id"
field.bracket.quote = "locator"
field.override.reference_id = "ref_id"
field.override.citation_number = "no"
field.override.locator = "loc"
