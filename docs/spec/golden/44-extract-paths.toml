[[task]]
name = "Golden 44"
input = "./src/[slug].mdp"
output = "./out/[slug].jsx"
plugin = "micromatter,anchor,number,extract,markdown"
format = "solid"

# D-6 / §21.4: `include` / `only` / `omit` are **dotted paths**, and a prefix
# takes the whole subtree. PE.1–PE.4 are the proposal's four worked examples
# (§9 of the Stage-2 issue): the same record selected four ways, where `omit`
# always wins and `only` can only keep what the preset already reached — so PE.4
# is `[{}]`, one empty row, not an error and not the whole preset.
#
# The anchor is numbered on purpose (S2-9.4): all four blocks name
# `number.raw`, and the field has to exist before a block can reach it. The
# numbering pass publishes `number.raw` / `number.depth` (ADR-0016) into the
# stream's attributes, so extraction sees ordinary fields — none of the three is
# in the `pendon` preset (D-13), which is why PE.1 must `include` it and PE.4
# still selects nothing.

# S2-9.4: one counter for the anchors. `number` runs after `anchor` and before
# `extract`, the only position where it can see the element and extraction can
# see its fields (ADR-0010).
[[task.anchor.number]]
style = "decimal"

# PE.1 — the pendon preset, one nested subtree included, one leaf cut out of it.
# `number.raw` is the numbering field a component reads; it is not in the preset,
# so `include` is what reaches it.
[[task.anchor.extract]]
output = "./out/[slug].PE.1.json"
format = "json"
preset = "pendon"
include = ["number.raw", "price.details.amount"]
omit = ["price.details.amount.unit"]

# PE.2 — the same, on `all`: `include` is redundant there but still valid
[[task.anchor.extract]]
output = "./out/[slug].PE.2.json"
format = "json"
preset = "all"
include = ["number.raw", "price.details.amount"]
omit = ["price.details.amount.unit"]

# PE.3 — `only` keeps those two paths and nothing else
[[task.anchor.extract]]
output = "./out/[slug].PE.3.json"
format = "json"
preset = "all"
only = ["number.raw", "price.details.amount"]
omit = ["price.details.amount.unit"]

# PE.4 — `only` cannot add: neither path is in the anchor preset, so `[{}]`
[[task.anchor.extract]]
output = "./out/[slug].PE.4.json"
format = "json"
preset = "pendon"
only = ["number.raw", "price.details.amount"]
omit = ["price.details.amount.unit"]
