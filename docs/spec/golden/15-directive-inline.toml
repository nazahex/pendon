[[task]]
name = "Golden 15"
input = "./src/[slug].mdp"
output = "./out/[slug].jsx"
plugin = "frontmatter,directive,markdown"
format = "solid"

# §10.2: the `directive` primary layer, addressed by the plugin's own key.
# §6.1/D-5: the entry renames the positional slots through `field.*` —
# `[bracket]`→`id`, the paren's **quote** (`("paren")`, §5.2)→`level`, a
# backticked item→`author`, a quoted item→`summary`.
[[task.directive.custom]]
type = ["note"]
name = "Note"
field.bracket.bare = "id"
field.paren.quote = "level"
field.specs.tick = "author"
field.specs.quote = "summary"
imports = "import { Note } from '@comp/Directive'"
template = "<Note {...attrs}>{children}</Note>"

# An unclaimed type routes here (§11 rule 3).
[[task.directive.custom]]
name = "DirectiveDefault"
imports = "import { DirectiveDefault } from '@comp/Directive'"
template = "<DirectiveDefault {...attrs}>{children}</DirectiveDefault>"
