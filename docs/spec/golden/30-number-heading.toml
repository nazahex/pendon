[[task]]
name = "Golden 30"
input = "./src/[slug].mdp"
output = "./out/[slug].jsx"
plugin = "micromatter,heading,number,markdown"
format = "solid"

# §11 component set: one entry with no `type` is the layer default, so every
# heading renders with it. `{...attrs}` is how a client reads the numbering:
# `number.raw` is a real array (`["1", "2"]`), `number.depth` a real number
# (ADR-0010 rule 5, ADR-0016).
[[task.heading.custom]]
name = "Heading"
imports = "import { Heading } from '@comp/Heading'"
template = "<Heading {...attrs}>{children}</Heading>"

# P.1 of docs/issues/plugin-number.md: ONE counter shared by `HeadingA` and
# `HeadingB`, styled per depth; undefined deeper depths fall back to decimal.
[[task.heading.number]]
type = ["HeadingA", "HeadingB"]
style = ["decimal", "decimal", "lower-alpha"]
