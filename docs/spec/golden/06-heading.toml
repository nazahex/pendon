[[task]]
name = "Golden 06"
input = "./src/[slug].mdp"
output = "./out/[slug].jsx"
plugin = "micromatter,heading,markdown"
format = "solid"

# Numbering moved to `plugin-number` (ADR-0010): a heading no longer counts, and
# an authored `number:` prop now simply passes through to the component.
[task.heading]

[[task.heading.custom]]
type = ["headingX", "headingY"]
name = "HeadingXY"
imports = "import { HeadingXY } from '@comp/Heading'"
template = "<HeadingXY depth={\"{attrs.depth}\"} type={\"{attrs.type}\"} number={\"{attrs.number}\"} {...attrs}>{children}</HeadingXY>"

[[task.heading.custom]]
name = "HeadingDefault"
imports = "import { HeadingDefault } from '@comp/Heading'"
template = "<HeadingDefault {...attrs}>{children}</HeadingDefault>"
