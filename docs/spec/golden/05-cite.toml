[[task]]
name = "Golden 05"
input = "./src/[slug].mdp"
output = "./out/[slug].jsx"
plugin = "micromatter,cite,markdown"
format = "solid"

[task.cite]
reference_source = "internal"

[task.cite.custom]
name = "Cite"
imports = "import { Cite } from '@comp/Cite'"
template = "<Cite reference={references[\"{attrs.ref_id}\"]} {...attrs} />"
